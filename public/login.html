<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anmelden — ExitAI</title><link rel="stylesheet" href="/site.css"><script src="/login.js" defer></script></head><body><header class="site-header"><a class="logo" href="/">◈ ExitAI.</a><span>Dein Team-Arbeitsbereich</span></header><main class="wrap document"><p class="eyebrow dark">ZENTRALER ZUGANG</p><h1>Willkommen zurück.</h1><p>Melde dich mit dem Zugang an, den du von deinem Administrator erhalten hast.</p><form id="login-form" class="demo-box"><label for="username">Benutzername</label><input id="username" name="username" autocomplete="username" required maxlength="80"><label for="password">Passwort</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256"><button class="button dark-button" type="submit">Sicher anmelden →</button><p id="login-status" role="status"></p></form><p>Sitzungen enden nach spätestens acht Stunden. Melde dich nach der Nutzung ab, insbesondere auf gemeinsam genutzten Rechnern.</p></main></body></html>
